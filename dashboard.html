<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analítico - Siembras</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <!-- Custom Dashboard CSS -->
    <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
    <div class="dashboard-container">
        
        <!-- Top Bar: Filtros Horizontales -->
        <header class="top-bar">
            <div class="brand">
                <a href="index.html" class="btn-back-small" title="Volver al Monitor">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <div class="brand-text">
                    <h1>🌱 Arba Siembras</h1>
                    <p>Dashboard Analítico</p>
                </div>
            </div>

            <div class="horizontal-filters">
                <div class="filter-item">
                    <label for="filter-especie">Especie</label>
                    <select id="filter-especie"><option value="all">Todas</option></select>
                </div>

                <div class="filter-item">
                    <label for="filter-tratamiento">Tratamiento</label>
                    <select id="filter-tratamiento"><option value="all">Todos</option></select>
                </div>

                <div class="filter-item">
                    <label for="filter-micrositio">Micrositio</label>
                    <select id="filter-micrositio"><option value="all">Todos</option></select>
                </div>

                <div class="filter-item">
                    <label for="filter-orientacion">Orientación</label>
                    <select id="filter-orientacion"><option value="all">Todas</option></select>
                </div>

                <button id="btn-reset-filters" class="btn-reset-small" title="Limpiar Filtros">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- KPIs -->
            <section class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon species">🌿</div>
                    <div class="kpi-info">
                        <span class="kpi-label">Especies</span>
                        <span class="kpi-value" id="kpi-especies">0</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon holes">🎯</div>
                    <div class="kpi-info">
                        <span class="kpi-label">Golpes</span>
                        <span class="kpi-value" id="kpi-golpes">0</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon seeds">🌰</div>
                    <div class="kpi-info">
                        <span class="kpi-label">Semillas</span>
                        <span class="kpi-value" id="kpi-semillas">0</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon records">📝</div>
                    <div class="kpi-info">
                        <span class="kpi-label">Registros</span>
                        <span class="kpi-value" id="kpi-registros">0</span>
                    </div>
                </div>
            </section>

            <!-- Charts & Map -->
            <section class="charts-grid">
                <div class="chart-card species-chart">
                    <h3>Distribución de Especies</h3>
                    <div class="chart-container">
                        <canvas id="chartEspecies"></canvas>
                    </div>
                </div>
                
                <div class="chart-card map-card">
                    <h3>Mapa de Siembras</h3>
                    <div id="dashboard-map"></div>
                </div>

                <div class="chart-card treatment-chart">
                    <h3>Tratamientos</h3>
                    <div class="chart-container">
                        <canvas id="chartTratamientos"></canvas>
                    </div>
                </div>

                <div class="chart-card microsite-chart">
                    <h3>Micrositios</h3>
                    <div class="chart-container">
                        <canvas id="chartMicrositios"></canvas>
                    </div>
                </div>
            </section>

            <!-- Table Section -->
            <section class="table-card">
                <div class="table-header">
                    <h3>Listado de Golpes</h3>
                    <div class="pagination-controls" id="pagination-top">
                        <!-- Pagination will be injected here -->
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Especie</th>
                                <th>Golpes</th>
                                <th>Tratamiento</th>
                                <th>Micrositio</th>
                                <th>Equipo</th>
                                <th>Foto</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Data rows will be injected here -->
                        </tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <div class="pagination-info" id="pagination-info">
                        Mostrando registros del 1 al 25
                    </div>
                    <div class="pagination-controls" id="pagination-bottom">
                        <!-- Pagination will be injected here -->
                    </div>
                </div>
            </section>

        </main>
    </div>


    <!-- External Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Data and Custom Logic -->
    <script src="data/datos_consolidados.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
